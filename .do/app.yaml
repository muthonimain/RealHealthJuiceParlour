# DigitalOcean App Platform spec — https://docs.digitalocean.com/products/app-platform/reference/app-spec/
name: real-health-juice-parlour
region: fra

databases:
  - name: rhjp-db
    engine: PG
    version: "16"
    production: true

services:
  - name: api
    github:
      repo: muthonimain/RealHealthJuiceParlour
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: npm run install:all && npm run build
    run_command: npm run start
    http_port: 5000
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${rhjp-db.DATABASE_URL}
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: OWNER_1_NAME
        scope: RUN_TIME
        type: SECRET
      - key: OWNER_1_USERNAME
        scope: RUN_TIME
        type: SECRET
      - key: OWNER_1_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: OWNER_2_NAME
        scope: RUN_TIME
        type: SECRET
      - key: OWNER_2_USERNAME
        scope: RUN_TIME
        type: SECRET
      - key: OWNER_2_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: EMPLOYEE_1_NAME
        scope: RUN_TIME
        type: SECRET
      - key: EMPLOYEE_1_USERNAME
        scope: RUN_TIME
        type: SECRET
      - key: EMPLOYEE_1_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: EMPLOYEE_2_NAME
        scope: RUN_TIME
        type: SECRET
      - key: EMPLOYEE_2_USERNAME
        scope: RUN_TIME
        type: SECRET
      - key: EMPLOYEE_2_PASSWORD
        scope: RUN_TIME
        type: SECRET
