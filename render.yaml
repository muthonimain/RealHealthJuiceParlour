# Render Blueprint — connect this GitHub repo in the Render dashboard
# https://render.com/docs/blueprint-spec

databases:
  - name: rhjp-db
    databaseName: rhjp_pos
    user: rhjp
    plan: free

services:
  - type: web
    name: real-health-juice-parlour
    runtime: node
    plan: free
    # NODE_ENV=production is set for runtime; install must still get devDependencies (vite, tsc, @types)
    buildCommand: NPM_CONFIG_PRODUCTION=false npm run install:all && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: rhjp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Staff credentials — set values in Render Dashboard → Environment
      - key: OWNER_1_NAME
        sync: false
      - key: OWNER_1_USERNAME
        sync: false
      - key: OWNER_1_PASSWORD
        sync: false
      - key: OWNER_2_NAME
        sync: false
      - key: OWNER_2_USERNAME
        sync: false
      - key: OWNER_2_PASSWORD
        sync: false
      - key: EMPLOYEE_1_NAME
        sync: false
      - key: EMPLOYEE_1_USERNAME
        sync: false
      - key: EMPLOYEE_1_PASSWORD
        sync: false
      - key: EMPLOYEE_2_NAME
        sync: false
      - key: EMPLOYEE_2_USERNAME
        sync: false
      - key: EMPLOYEE_2_PASSWORD
        sync: false
