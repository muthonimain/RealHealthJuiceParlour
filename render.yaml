# Render Blueprint — connect this GitHub repo in the Render dashboard
# https://render.com/docs/blueprint-spec

databases:
  - name: rhjp-db
    databaseName: rhjp_pos
    user: rhjp
    plan: free

services:
  - type: web
    name: real-health-juice-parlour
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: rhjp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Set these in Render Dashboard → Environment (required for login):
      # OWNER_1_NAME, OWNER_1_USERNAME, OWNER_1_PASSWORD
      # OWNER_2_NAME, OWNER_2_USERNAME, OWNER_2_PASSWORD
      # EMPLOYEE_1_NAME, EMPLOYEE_1_USERNAME, EMPLOYEE_1_PASSWORD
      # EMPLOYEE_2_NAME, EMPLOYEE_2_USERNAME, EMPLOYEE_2_PASSWORD
