services:
  # Backend API
  - type: web
    name: rhjp-api
    env: node
    region: oregon
    buildCommand: cd server && npm install && npm run build
    startCommand: cd server && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        fromService:
          name: rhjp-client
          type: web
          property: host

  # Frontend
  - type: web
    name: rhjp-client
    env: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: rhjp-api
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
